<!DOCTYPE html>
<!-- 微醺图鉴 v6：155 款鸡尾酒、9 种基酒；同一款酒不同出处的配方、成品酒精度估算、家族与变体、技法与自制原料；按风味找酒、中英双语、手机适配；单文件、无外部资源，断网可用。由 scratch/build.py 从 src/ 生成，要改请改源文件后重新构建。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>微醺图鉴 · 鸡尾酒与基酒模糊搜索</title>
<meta name="description" content="动画风格的鸡尾酒图鉴：模糊搜索 155 款鸡尾酒和 9 种基酒，可以按风味找酒，同一款酒有不同出处的配方，附成品酒精度估算，中英双语。">
<style>
/* ============================================================
 * 微醺图鉴 · 样式
 * 界面色跟随宿主主题变量（--background / --card / --foreground ...），
 * 单独打开时使用 var() 里的暖色回退值；插画使用固定配色。
 * 悬停效果都包在 @media (hover: hover) 里：触屏上点过之后 :hover 会粘住，所以只给有鼠标的设备。
 * ============================================================ */
:where(html) {
  font-family: var(--font-family, "Google Sans Flex", "Google Sans", system-ui, -apple-system, "Segoe UI", Roboto,
    "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif);
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  --bg: var(--background, #fff5e3);
  --surface: var(--card, #fffdf8);
  --ink: var(--foreground, #2b2118);
  --muted: var(--muted-foreground, #7a6c5c);
  --line: color-mix(in srgb, var(--ink) 20%, transparent);
  --wash: color-mix(in srgb, var(--ink) 6%, transparent);
  --sun: #ffc93c;
  --sun-ink: #2b2118;
  --pop: var(--ink);
  --ease-out: cubic-bezier(.2, .8, .2, 1);
  --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
  margin: 0;
  background-color: var(--bg);
  background-image:
    radial-gradient(620px 300px at 8% -40px, color-mix(in srgb, var(--sun) 26%, transparent), transparent 72%),
    radial-gradient(520px 280px at 96% -20px, color-mix(in srgb, #ff8fa3 18%, transparent), transparent 72%);
  background-repeat: no-repeat;
  color: var(--ink);
  font-size: 15px;
  line-height: 1.6;
  font-variation-settings: "ROND" 100;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
button, .opt { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; }
ul, ol { padding: 0; list-style: none; }
svg { display: block; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
[tabindex="-1"]:focus { outline: none; }
mark { background: var(--sun); color: var(--sun-ink); border-radius: 5px; padding: 0 2px; margin: 0 -1px; }
::selection { background: color-mix(in srgb, var(--sun) 65%, transparent); }

.page { --pad: clamp(16px, 4vw, 36px); max-width: 1080px; margin: 0 auto; padding: 18px var(--pad) 40px; }

/* ---------- 顶栏 ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; letter-spacing: .08em; border-radius: 12px; }
.shaker { width: 34px; height: 41px; overflow: visible; transform-origin: 50% 85%; }
.shaker.shake { animation: shake .5s var(--ease-out); }
.shaker .eye { transform-box: fill-box; transform-origin: center; animation: blink 5.2s infinite; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px;
  border: 2.5px solid var(--ink); border-radius: 999px; background: var(--surface);
  font-weight: 700; font-size: 14px; white-space: nowrap; box-shadow: 3px 3px 0 var(--pop);
  transition: transform .12s var(--ease-out), box-shadow .12s var(--ease-out), background-color .12s;
}
@media (hover: hover) { .btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--pop); } }
.btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--pop); }
.btn-sun { background: var(--sun); color: var(--sun-ink); }
.btn .ico { flex: none; }
@media (hover: hover) { .btn:hover .dice { animation: roll .5s var(--ease-out); } }
.btn-s { height: 34px; padding: 0 13px; gap: 5px; font-size: 13px; box-shadow: 2px 2px 0 var(--pop); }
@media (hover: hover) { .btn-s:hover { box-shadow: 3px 3px 0 var(--pop); } }
.top-tools { display: flex; align-items: center; gap: 10px; }
@media (max-width: 600px) {
  .top .btn { padding: 0 11px; }
  .btn-label { display: none; }
}
/* 语言开关：一颗药丸分成两段，当前语言的那一段填色 */
.lang { display: inline-flex; flex: none; border-radius: 999px; box-shadow: 3px 3px 0 var(--pop); }
.lang-btn {
  min-width: 46px; height: 40px; padding: 0 11px; border: 2.5px solid var(--ink); background: var(--surface);
  color: var(--muted); font-weight: 800; font-size: 13px; text-align: center; white-space: nowrap;
  transition: background-color .12s, color .12s;
}
.lang-btn:first-child { padding-left: 14px; border-right-width: 1.25px; border-radius: 999px 0 0 999px; }
.lang-btn:last-child { padding-right: 14px; border-left-width: 1.25px; border-radius: 0 999px 999px 0; }
@media (hover: hover) { .lang-btn:hover { color: var(--ink); background: color-mix(in srgb, var(--sun) 22%, var(--surface)); } }
.lang-btn[aria-pressed="true"] { background: var(--sun); color: var(--sun-ink); }
.lang-btn:focus-visible { position: relative; z-index: 1; }

/* ---------- 主视觉 ---------- */
.hero { text-align: center; padding: clamp(22px, 5vw, 44px) 0 0; }
.hero h1 { display: flex; align-items: center; justify-content: center; gap: .32em; font-size: clamp(30px, 5.4vw, 50px); line-height: 1.18; font-weight: 800; letter-spacing: .03em; text-wrap: balance; }
.deco { flex: none; width: .9em; height: .9em; overflow: visible; }
.deco-l { animation: spin 16s linear infinite; }
.deco-r { height: 1.06em; transform-origin: 55% 8%; animation: swing 3.4s ease-in-out infinite; }
@media (max-width: 440px) { .deco { display: none; } }
.squig { position: relative; display: inline-block; white-space: nowrap; }
.squig svg { position: absolute; left: -3%; bottom: -.14em; width: 106%; height: .3em; overflow: visible; animation: reveal .7s .3s var(--ease-out) both; }
.squig path { fill: none; stroke: var(--sun); stroke-width: 5; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.lead { color: var(--muted); max-width: 32em; margin: 14px auto 0; font-size: 15px; text-wrap: balance; }
body:not([data-view="home"]) .hero, body:not([data-view="home"]) .chips { display: none; }

/* ---------- 搜索框 ---------- */
.searchwrap { position: sticky; top: 10px; z-index: 30; max-width: 680px; margin: 26px auto 0; }
body:not([data-view="home"]) .searchwrap { margin-top: 16px; }
.search {
  display: flex; align-items: center; gap: 12px; height: 62px; padding: 0 14px 0 20px;
  background: var(--surface); border: 3px solid var(--ink); border-radius: 22px; box-shadow: 5px 5px 0 var(--pop);
  transition: transform .16s var(--ease-out), box-shadow .16s var(--ease-out);
}
.search:focus-within { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--sun), 7px 7px 0 2.5px var(--ink); }
.search .ico-search { flex: none; transition: transform .2s var(--ease-spring); }
.search:focus-within .ico-search { transform: rotate(-12deg) scale(1.08); }
.search input {
  flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent;
  font-size: 18px; font-weight: 600; text-overflow: ellipsis;
}
.search input::placeholder { color: var(--muted); opacity: 1; font-weight: 500; }
.kbd { flex: none; min-width: 26px; height: 26px; display: grid; place-items: center; border: 2px solid var(--line); border-radius: 8px; font-size: 13px; font-weight: 700; color: var(--muted); }
.search:focus-within .kbd, .search.has-value .kbd { display: none; }
@media (hover: none) { .kbd { display: none; } }
.clear { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); transition: background-color .12s, transform .12s; }
@media (hover: hover) { .clear:hover { background: var(--wash); color: var(--ink); transform: rotate(90deg); } }
.clear:active { background: var(--wash); color: var(--ink); }

/* ---------- 搜索结果下拉 ---------- */
.results {
  position: absolute; left: 0; right: 0; top: calc(100% + 12px); max-height: max(150px, min(452px, calc(var(--vvh, 100vh) - 110px))); overflow: auto; padding: 8px;
  background: var(--surface); border: 3px solid var(--ink); border-radius: 20px; box-shadow: 6px 6px 0 var(--pop);
  animation: dropIn .18s var(--ease-out) both; transform-origin: 50% 0;
  scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--ink) 38%, transparent) transparent;
}
.grp { padding: 8px 10px 4px; font-size: 12px; font-weight: 800; letter-spacing: .1em; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.grp span + span { font-weight: 600; letter-spacing: 0; }
.opt { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 7px 10px; border-radius: 14px; cursor: pointer; }
.opt[aria-selected="true"] { background: var(--sun); color: var(--sun-ink); }
.opt[aria-selected="true"] .opt-en, .opt[aria-selected="true"] .opt-sub { color: color-mix(in srgb, var(--sun-ink) 78%, transparent); }
.opt[aria-selected="true"] mark { background: #ffffff; }
.opt[aria-selected="true"] .thumb { border-color: var(--sun-ink); }
.opt[aria-selected="true"] .opt-kind { color: var(--sun-ink); border-color: color-mix(in srgb, var(--sun-ink) 45%, transparent); }
.opt[aria-selected="true"] .opt-kind.is-spirit { background: #ffffff; border-color: var(--sun-ink); }
.opt[aria-selected="true"] .thumb .art { animation: wiggle .5s var(--ease-out); }
.opt-title { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.opt-zh { min-width: 0; font-weight: 800; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.opt-en { flex-shrink: 9999; color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.opt-sub { display: block; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.opt-sub b { font-weight: 700; margin-right: 6px; }
.opt-kind { font-size: 12px; font-weight: 700; padding: 2px 9px; border: 2px solid var(--line); border-radius: 999px; white-space: nowrap; color: var(--muted); }
.opt-kind.is-spirit { background: var(--sun); color: var(--sun-ink); border-color: var(--sun-ink); }
.thumb {
  position: relative; flex: none; width: 52px; height: 52px; overflow: hidden;
  border: 2.5px solid var(--ink); border-radius: 14px; background: var(--tint, #eee);
}
.thumb .art { position: absolute; left: 4px; top: 4px; width: calc(100% - 8px); height: calc(100% - 7px); }
.thumb-fl { display: grid; place-items: center; background: color-mix(in srgb, var(--sun) 30%, var(--surface)); }
.opt[aria-selected="true"] .thumb-fl { background: #ffffff; color: var(--sun-ink); }
.opt-kind.is-flavor { border-style: dashed; }
.art { width: 100%; height: 100%; }
.empty { padding: 22px 16px 18px; text-align: center; }
.empty p { font-weight: 700; }
.empty .hint { margin-top: 4px; font-weight: 500; font-size: 13px; color: var(--muted); }
.empty .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 14px; }

/* ---------- 基酒快捷入口 ---------- */
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 22px auto 0; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 15px 0 11px;
  border: 2.5px solid var(--ink); border-radius: 999px; background: var(--surface);
  font-weight: 700; font-size: 14px; box-shadow: 3px 3px 0 var(--pop);
  transition: transform .12s var(--ease-out), box-shadow .12s var(--ease-out), background-color .12s, color .12s;
}
@media (hover: hover) { .chip:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--pop); background: var(--sun); color: var(--sun-ink); } }
.chip:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--pop); }
.dot { flex: none; width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--sun-ink); background: var(--c, #ccc); }
/* 第二排：常用风味，比基酒那排小一号；最后一颗通向“按风味找酒” */
.chips.flavors { gap: 8px; margin-top: 12px; }
.chip-fl { height: 34px; padding: 0 13px; font-size: 13.5px; background: color-mix(in srgb, var(--sun) 14%, var(--surface)); box-shadow: 2px 2px 0 var(--pop); }
.chip-find { gap: 5px; padding: 0 8px 0 10px; background: var(--sun); color: var(--sun-ink); }
/* 窄的触屏：两排快捷入口各自收成一行、横向滑动（不然光这些就占掉大半屏）；右边缘渐隐，提示后面还有。
 * 用鼠标的窄窗口（比如侧边栏）照旧折行：没有横向滚动条时，鼠标滚轮够不到右边的内容 */
@media (max-width: 640px) and (pointer: coarse) {
  .chips, .chips.flavors {
    flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none;
    margin: 20px calc(var(--pad) * -1) 0; padding: 2px var(--pad) 6px;
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 30px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 30px), transparent);
  }
  .chips.flavors { margin-top: 6px; }
  .chips::-webkit-scrollbar { display: none; }
  .chips::after { content: ""; flex: none; width: 14px; }
  .chip { flex: none; }
}

/* ---------- 酒单 ---------- */
#view { margin-top: 34px; }
.sec-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 16px; }
.sec-head h2, .sec-head h3 { font-size: 21px; font-weight: 800; letter-spacing: .04em; }
.sec-head .count { color: var(--muted); font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 18px 16px; }
.card {
  position: relative; display: flex; flex-direction: column; min-width: 0; overflow: hidden;
  background: var(--surface); border: 2.5px solid var(--ink); border-radius: 20px; box-shadow: 4px 4px 0 var(--pop);
  transition: transform .14s var(--ease-out), box-shadow .14s var(--ease-out);
}
@media (hover: hover) { .card:hover { transform: translate(-2px, -3px); box-shadow: 6px 7px 0 var(--pop); } }
.card:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--pop); }
.card .pic { position: relative; display: block; aspect-ratio: 1 / 1; background: var(--tint, #eee); border-bottom: 2.5px solid var(--ink); }
.card .pic .art { position: absolute; left: 12px; top: 12px; width: calc(100% - 24px); height: calc(100% - 21px); }
@media (hover: hover) { .card:hover .pic .art { animation: wiggle .55s var(--ease-out); } }
.card .meta { display: block; padding: 9px 12px 11px; }
.card .zh { display: block; font-weight: 800; font-size: 15px; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .en { display: block; color: var(--muted); font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.view-enter { animation: viewIn .3s var(--ease-out) both; }
.view-enter .card { animation: cardIn .42s var(--ease-out) both; animation-delay: calc(min(var(--i, 0), 26) * 20ms); }

/* ---------- 详情 ---------- */
.crumb { margin-bottom: 20px; }
.detail { display: grid; grid-template-columns: minmax(0, 1fr); gap: 26px 40px; }
.stage-col { width: 100%; max-width: 330px; max-width: min(330px, max(170px, calc((100svh - 112px) * 6 / 7))); margin: 0 auto; }
.stage {
  position: relative; aspect-ratio: 6 / 7; overflow: hidden;
  background: var(--tint, #eee); border: 3px solid var(--ink); border-radius: 30px; box-shadow: 7px 7px 0 var(--pop);
}
.stage::before {
  content: ""; position: absolute; left: 50%; top: 53.6%; width: 190%; aspect-ratio: 1; transform: translate(-50%, -50%);
  background: repeating-conic-gradient(color-mix(in srgb, var(--tint, #eee) 64%, #ffffff) 0 15deg, transparent 15deg 30deg);
  animation: raySpin 90s linear infinite;
}
.stage .art { position: absolute; inset: 0; }
.stage-btn {
  position: absolute; right: 12px; bottom: 12px; width: 42px; height: 42px; display: grid; place-items: center;
  border: 2.5px solid var(--sun-ink); border-radius: 50%; background: #fff; color: var(--sun-ink); box-shadow: 3px 3px 0 var(--sun-ink);
  transition: transform .12s var(--ease-out), box-shadow .12s var(--ease-out);
}
@media (hover: hover) { .stage-btn:hover { transform: translate(-1px, -1px) rotate(-30deg); box-shadow: 4px 4px 0 var(--sun-ink); } }
.stage-btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--sun-ink); }
.stage-btn:focus-visible { outline-color: var(--sun-ink); }
.d-head h1 { font-size: clamp(30px, 4.6vw, 44px); line-height: 1.15; font-weight: 800; letter-spacing: .03em; }
.d-en { margin-top: 4px; color: var(--muted); font-size: 17px; font-weight: 600; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.tag {
  display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px;
  border: 2px solid var(--line); border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap;
}
button.tag { padding-left: 9px; border-color: var(--ink); background: var(--surface); box-shadow: 2px 2px 0 var(--pop); transition: transform .12s var(--ease-out), box-shadow .12s var(--ease-out), background-color .12s, color .12s; }
button.tag-go { gap: 3px; padding: 0 8px 0 12px; }
.tag-set { border-style: dashed; color: var(--muted); }
@media (hover: hover) { button.tag:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--pop); background: var(--sun); color: var(--sun-ink); } }
button.tag:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--pop); }
.desc { margin-top: 16px; font-size: 16px; max-width: 34em; }
/* 风味档案：甜 / 酸 / 苦 / 酒感四条刻度排成 2×2，下面是可以点的风味标签 */
.info { container: info / inline-size; }
.scales { display: grid; grid-template-columns: repeat(2, max-content); gap: 8px clamp(14px, 5vw, 34px); }
.scale { --slw: 2.3em; display: grid; grid-template-columns: minmax(var(--slw), max-content) max-content; align-items: center; align-content: start; column-gap: 8px; font-size: 13px; font-weight: 700; }
.pips { display: inline-flex; gap: 4px; }
.pip { width: 13px; height: 13px; border: 2px solid var(--ink); border-radius: 50%; }
.pip.on { background: var(--sun); }
/* 酒感的文字档位：地方够就跟在圆点右边，不够就落到圆点下面 */
.scale .lv { grid-column: 2; color: var(--muted); font-size: 12px; font-weight: 600; line-height: 1.35; }
@container info (min-width: 430px) {
  .scale { grid-template-columns: minmax(var(--slw), max-content) max-content max-content; }
  .scale .lv { grid-column: 3; font-size: 13px; }
}
.fl-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.ftag {
  display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border: 2px solid var(--ink); border-radius: 999px;
  background: color-mix(in srgb, var(--sun) 14%, var(--surface)); font-size: 13px; font-weight: 700; white-space: nowrap; box-shadow: 2px 2px 0 var(--pop);
  transition: transform .12s var(--ease-out), box-shadow .12s var(--ease-out), background-color .12s, color .12s;
}
@media (hover: hover) { .ftag:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--pop); background: var(--sun); color: var(--sun-ink); } }
.ftag:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--pop); }

.sec { margin-top: 28px; }
.sec-title { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-bottom: 12px; font-size: 17px; font-weight: 800; letter-spacing: .08em; }
.sec-title::after { content: ""; flex: 1; border-top: 2.5px dashed var(--line); }
.sec-title .tools { order: 2; display: inline-flex; align-items: center; gap: 8px; margin-left: auto; font-size: 14px; letter-spacing: 0; }
.sec-title .ver { padding: 1px 10px; border: 2px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 12.5px; font-weight: 700; }

/* 配方：同一款酒不同出处的版本排成一行标签页；面板横向排开，点标签或左右滑动切换 */
.rtabs { display: flex; gap: 8px; margin: 0 -4px 10px; padding: 2px 6px 6px 4px; overflow-x: auto; scrollbar-width: none; }
.rtabs::-webkit-scrollbar { display: none; }
.rtab {
  flex: none; height: 34px; padding: 0 14px; border: 2.5px solid var(--ink); border-radius: 999px; background: var(--surface);
  font-size: 13.5px; font-weight: 800; white-space: nowrap; box-shadow: 2px 2px 0 var(--pop);
  transition: transform .1s var(--ease-out), box-shadow .1s var(--ease-out), background-color .1s, color .1s;
}
@media (hover: hover) { .rtab:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--pop); } }
.rtab[aria-selected="true"] { background: var(--sun); color: var(--sun-ink); transform: translate(2px, 2px); box-shadow: 0 0 0 var(--pop); }
.rtrack {
  position: relative; display: flex; align-items: flex-start; gap: 28px; margin: -4px -6px -6px; padding: 4px 6px 6px;
  overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain; scroll-snap-type: x mandatory; scroll-padding: 0 6px; scrollbar-width: none;
  transition: height .2s var(--ease-out);
}
.rtrack::-webkit-scrollbar { display: none; }
.rpanel { flex: 0 0 100%; min-width: 0; scroll-snap-align: start; }
.rsrc { margin-bottom: 12px; color: var(--muted); font-size: 13.5px; }
.rsrc b { margin-right: 8px; color: var(--ink); font-weight: 800; }
.rdiff { margin-top: 14px; font-size: 14px; }

.ratio { display: flex; height: 22px; margin-bottom: 8px; overflow: hidden; border: 2.5px solid var(--ink); border-radius: 999px; background: var(--surface); }
.seg { flex: 1 1 0; min-width: 5px; background: var(--c); transform-origin: 0 50%; animation: segIn .5s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 60ms + .15s); transition: filter .15s; }
.seg + .seg { border-left: 2px solid var(--sun-ink); }
.seg.est { background-image: repeating-linear-gradient(-45deg, transparent 0 4px, rgba(43, 33, 24, .16) 4px 6px); }
.ratio.dim .seg:not(.hot) { filter: saturate(.4) opacity(.45); }
.ing li { display: flex; align-items: baseline; gap: 10px; padding: 9px 2px; border-bottom: 2px dotted var(--line); animation: rowIn .36s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 45ms + .1s); }
.ing .dot { align-self: flex-start; margin-top: 4.5px; }
/* 名称、英文名、备注：一行放得下就排成一行（备注靠右），放不下时英文名和备注各自折到下一行，数量始终在右边 */
.ing .what { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 10px; }
.ing .nm { font-weight: 700; }
.ing .en { color: var(--muted); font-size: 12.5px; }
.ing .note { margin-left: auto; color: var(--muted); font-size: 12.5px; }
.ing .amt { font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; display: inline-block; }
/* 材料规格（糖浆浓度、是否鲜榨……）：能自己做的材料，规格是个按钮，点过去看做法 */
.ing .spec { display: inline-flex; align-items: center; gap: 2px; padding: 0 7px; border: 1.5px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 12px; font-weight: 600; line-height: 1.5; }
.ing .spec-btn { border-color: var(--ink); background: color-mix(in srgb, var(--sun) 16%, var(--surface)); color: var(--ink); font-weight: 700; transition: background-color .12s; }
@media (hover: hover) { .ing .spec-btn:hover { background: var(--sun); color: var(--sun-ink); } }

/* 成品估算 */
.est { margin-top: 16px; padding: 11px 14px 10px; border: 2.5px solid var(--ink); border-radius: 16px; background: var(--surface); box-shadow: 3px 3px 0 var(--pop); }
.est-title { color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: .1em; }
.est-nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 4px; }
.est-cell dt { color: var(--muted); font-size: 12px; font-weight: 700; }
.est-cell dd { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.est-meter { position: relative; height: 12px; margin: 24px 0 8px; border: 2px solid var(--ink); border-radius: 999px; background: var(--wash); }
.est-fill { display: block; height: 100%; min-width: 4px; border-radius: 999px; background: var(--sun); }
.est-mark { position: absolute; top: -5px; bottom: -5px; width: 0; border-left: 2.5px solid var(--ink); }
.est-mark-t { position: absolute; left: 0; bottom: 100%; transform: translateX(-50%); color: var(--muted); font-size: 12px; font-weight: 700; line-height: 1.3; white-space: nowrap; }
.est-health { color: var(--muted); font-size: 12.5px; }
.est-how { margin-top: 4px; font-size: 12.5px; }
.est-how summary { display: inline-block; cursor: pointer; font-weight: 700; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; }
.est-how summary::-webkit-details-marker { display: none; }
.est-how p { margin-top: 4px; color: var(--muted); }

.steps li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 14px; padding: 8px 0; animation: rowIn .36s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 60ms + .2s); }
.steps .num { width: 34px; height: 34px; display: grid; place-items: center; border: 2.5px solid var(--ink); border-radius: 50%; background: var(--sun); color: var(--sun-ink); font-weight: 800; font-size: 15px; }
.steps p { padding-top: 4px; }
.notes { display: grid; gap: 12px; margin-top: 18px; }
.note-box { padding: 11px 15px; border: 2.5px dashed var(--line); border-radius: 16px; background: color-mix(in srgb, var(--sun) 12%, transparent); }
.note-box b { margin-right: 8px; font-weight: 800; }
.note-box:nth-child(odd) { transform: rotate(-.5deg); }
.note-box:nth-child(even) { transform: rotate(.4deg); }

/* 详情页底部：相关的酒 */
.rel-tabs { display: flex; flex-wrap: wrap; gap: 10px; }
.rel-tab {
  display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 11px 0 15px; border: 2.5px solid var(--ink); border-radius: 999px;
  background: var(--surface); font-size: 14px; font-weight: 800; white-space: nowrap; box-shadow: 3px 3px 0 var(--pop);
  transition: transform .12s var(--ease-out), box-shadow .12s var(--ease-out), background-color .12s, color .12s;
}
.rel-tab .n { min-width: 24px; padding: 0 6px; border-radius: 999px; background: var(--wash); font-size: 12px; font-weight: 700; line-height: 1.6; text-align: center; font-variant-numeric: tabular-nums; }
.rel-tab .ico { transition: transform .18s var(--ease-out); }
@media (hover: hover) { .rel-tab:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--pop); } }
.rel-tab[aria-expanded="true"] { background: var(--sun); color: var(--sun-ink); transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--pop); }
.rel-tab[aria-expanded="true"] .n { background: #ffffff; }
.rel-tab[aria-expanded="true"] .ico { transform: rotate(180deg); }
.rel-panel { margin-top: 22px; }
.rel-group + .rel-group { margin-top: 26px; }
.rel-group h3 { margin-bottom: 8px; font-size: 17px; font-weight: 800; letter-spacing: .03em; }
.rel-lead { max-width: 46em; margin-bottom: 14px; color: var(--muted); font-size: 14px; }
.rel-group h3 + .grid { margin-top: 12px; }
.rel-more { margin-top: 16px; }
.card .cap { display: block; margin-top: 5px; color: var(--muted); font-size: 12px; line-height: 1.45; }
.card .cap b { color: var(--ink); font-weight: 800; }

/* ---------- 技法与自制原料 ---------- */
.guide-toc { display: grid; gap: 12px; margin-top: 20px; }
.gtoc-row { display: grid; grid-template-columns: 5.4em minmax(0, 1fr); gap: 6px 14px; align-items: start; }
.gchip {
  display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border: 2px solid var(--ink); border-radius: 999px;
  background: var(--surface); font-size: 13px; font-weight: 700; white-space: nowrap; box-shadow: 2px 2px 0 var(--pop);
  transition: transform .1s var(--ease-out), box-shadow .1s var(--ease-out), background-color .1s, color .1s;
}
@media (hover: hover) { .gchip:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--pop); background: var(--sun); color: var(--sun-ink); } }
.gchip:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--pop); }
.glist { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px; align-items: start; }
.gcard { padding: 14px 16px 15px; border: 2.5px solid var(--ink); border-radius: 18px; background: var(--surface); box-shadow: 4px 4px 0 var(--pop); scroll-margin-top: 96px; }
.gcard h3 { font-size: 16px; font-weight: 800; line-height: 1.35; }
.gcard h3 .en { margin-left: 4px; color: var(--muted); font-size: 12.5px; font-weight: 600; }
.gcard p { margin-top: 8px; font-size: 14px; }
.gcard .gk b, .gused b { margin-right: 8px; font-weight: 800; }
.gused { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; }
.gused b { color: var(--ink); margin-right: 2px; }
.gmini { height: 28px; padding: 0 10px; border: 2px solid var(--line); border-radius: 999px; color: var(--ink); font-size: 12.5px; font-weight: 700; white-space: nowrap; transition: background-color .12s, border-color .12s; }
@media (hover: hover) { .gmini:hover { background: var(--sun); border-color: var(--ink); color: var(--sun-ink); } }
.gcard.flash { animation: flash 1.4s var(--ease-out); }

.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 18px; margin-top: 18px; }
.facts dt { padding: 9px 0; color: var(--muted); font-size: 13px; font-weight: 700; white-space: nowrap; border-bottom: 2px dotted var(--line); }
.facts dd { padding: 9px 0; font-weight: 600; border-bottom: 2px dotted var(--line); }

/* ---------- 按风味找酒 ---------- */
.finder-lead { margin-top: 8px; max-width: 40em; color: var(--muted); }
.fgroups { display: grid; gap: 14px; margin-top: 22px; }
.fgroup { display: grid; grid-template-columns: 3.4em minmax(0, 1fr); gap: 6px 14px; align-items: start; }
.fg-label { padding-top: 7px; color: var(--muted); font-size: 13px; font-weight: 800; letter-spacing: .08em; }
.fg-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.fchip {
  display: inline-flex; align-items: center; height: 36px; padding: 0 13px; border: 2.5px solid var(--ink); border-radius: 999px;
  background: var(--surface); font-size: 14px; font-weight: 700; white-space: nowrap; box-shadow: 2px 2px 0 var(--pop);
  transition: transform .1s var(--ease-out), box-shadow .1s var(--ease-out), background-color .1s, color .1s;
}
@media (hover: hover) { .fchip:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--pop); } }
/* 选中的标签：填色并“按下去” */
.fchip[aria-pressed="true"] { background: var(--sun); color: var(--sun-ink); transform: translate(2px, 2px); box-shadow: 0 0 0 var(--pop); }
/* 状态条：结果还在屏幕下面时贴在底部，滚到它原本的位置就停住 */
.finder-bar {
  position: sticky; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 20; display: flex; align-items: center; gap: 8px;
  margin-top: 22px; padding: 8px 10px 8px 16px; background: var(--surface); border: 2.5px solid var(--ink); border-radius: 18px; box-shadow: 4px 4px 0 var(--pop);
}
.finder-bar.is-empty { position: static; padding: 0; border: 0; background: none; box-shadow: none; }
.finder-status { flex: 1; min-width: 0; font-weight: 700; }
.finder-bar.is-empty .finder-status { color: var(--muted); font-weight: 500; }
.fs-short, .btn-jump { display: none; }
.finder-results { scroll-margin-top: 92px; }
.finder-results > .sec:first-child { margin-top: 24px; }
.finder-hint { margin-top: 20px; padding: 11px 15px; border: 2.5px dashed var(--line); border-radius: 16px; font-weight: 600; }
.badge {
  position: absolute; left: 7px; top: 7px; z-index: 1; padding: 0 8px; border: 2px solid var(--sun-ink); border-radius: 999px;
  background: #ffffff; color: var(--sun-ink); font-size: 12px; font-weight: 800; line-height: 1.5;
}
.about { margin-top: 34px; padding: 10px 16px; border: 2.5px dashed var(--line); border-radius: 16px; }
.about summary { cursor: pointer; font-weight: 700; }
.about p { margin-top: 8px; max-width: 62em; color: var(--muted); font-size: 13.5px; }
/* ---------- 英文界面的微调：拉丁字母不需要中文那样的字距，标签列要宽一点 ---------- */
html:lang(en) .brand { letter-spacing: .02em; }
html:lang(en) .hero h1, html:lang(en) .d-head h1 { letter-spacing: 0; }
html:lang(en) .sec-head h2, html:lang(en) .sec-title { letter-spacing: .01em; }
html:lang(en) .grp span:first-child { letter-spacing: .08em; text-transform: uppercase; }
html:lang(en) .est-title { letter-spacing: .06em; text-transform: uppercase; }
html:lang(en) .gtoc-row { grid-template-columns: 9em minmax(0, 1fr); }
html:lang(en) .rel-group h3 { letter-spacing: 0; }
html:lang(en) .scale { --slw: 3.8em; }
/* 英文酒名长：卡片上的主名最多折两行，搜索结果里放不下时先省略小字的中文名 */
html:lang(en) .card .zh { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; white-space: normal; overflow-wrap: anywhere; }
html:lang(en) .fgroup { grid-template-columns: 7.4em minmax(0, 1fr); }
html:lang(en) .fg-label { padding-top: 9px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
/* 窄屏的“按风味找酒”：分组名放到标签上面；状态条只留数字，“看结果”变成一个向下的箭头 */
@media (max-width: 640px) {
  .fgroup, html:lang(en) .fgroup, .gtoc-row, html:lang(en) .gtoc-row { grid-template-columns: minmax(0, 1fr); }
  .fg-label, html:lang(en) .fg-label { padding-top: 0; }
  .finder-bar:not(.is-empty) .fs-long { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .fs-short { display: inline; }
  .btn-jump { display: inline-flex; width: 46px; padding: 0; }
}

.foot { margin-top: 52px; padding-top: 18px; border-top: 2.5px dashed var(--line); color: var(--muted); font-size: 12.5px; text-align: center; }

@media (min-width: 820px) {
  .detail { grid-template-columns: minmax(280px, 400px) minmax(0, 1fr); align-items: start; }
  .stage-col { position: sticky; top: 96px; max-width: 400px; max-width: min(400px, max(200px, calc((100svh - 124px) * 6 / 7))); }
  .detail .full { grid-column: 1 / -1; }
}
@media (max-width: 520px) {
  .est-cell dd { font-size: 15.5px; }
  .brand-name { display: none; }
  .search { height: 56px; border-radius: 20px; padding-left: 16px; }
  .search input { font-size: 16px; }
  .opt-kind { display: none; }
  .opt { grid-template-columns: 48px minmax(0, 1fr); }
  .thumb { width: 48px; height: 48px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 14px 12px; }
}
/* 矮屏（横着拿的手机）：插画按屏幕高度缩小，固定在左边，配方在右边滚动 */
@media (max-height: 520px) and (min-width: 560px) {
  .detail { grid-template-columns: auto minmax(0, 1fr); gap: 20px 28px; align-items: start; }
  .stage-col { position: sticky; top: 88px; margin: 0; max-width: none; width: 230px; width: clamp(170px, calc((100svh - 112px) * 6 / 7), 300px); }
  .detail .full { grid-column: 1 / -1; }
}
/* 触屏：把能点的东西放大到手指好按的尺寸 */
@media (pointer: coarse) {
  .brand { min-width: 44px; min-height: 44px; justify-content: center; }
  .btn, .chip { height: 44px; }
  .clear { width: 44px; height: 44px; }
  .search { padding-right: 9px; }
  .tag { height: 40px; }
  .stage-btn { width: 46px; height: 46px; }
  .lang-btn { min-width: 48px; height: 44px; }
  .chip-fl, .ftag, .fchip, .btn-s, .rtab, .gchip, .gmini { height: 40px; }
  .rel-tab { height: 44px; }
  .ing .spec-btn { min-height: 40px; margin: -8px 0; padding: 0 10px; }
  .about summary, .est-how summary { padding: 8px 0; }
}
/* 没有运行脚本时（比如手机的文件预览）给一句提示 */
.noscript + .noscript { margin-top: 10px; }
.noscript { max-width: 34em; margin: 26px auto 0; padding: 14px 18px; border: 2.5px dashed var(--line); border-radius: 16px; text-align: center; font-weight: 600; }

/* ---------- 界面动画 ---------- */
@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes cardIn { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes dropIn { from { opacity: 0; transform: translateY(-8px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes rowIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
@keyframes segIn { from { transform: scaleX(0); } to { transform: none; } }
@keyframes flash { 0%, 55% { background: color-mix(in srgb, var(--sun) 45%, var(--surface)); } 100% { background: var(--surface); } }
@keyframes reveal { from { clip-path: inset(-50% 100% -50% 0); } to { clip-path: inset(-50% -5% -50% 0); } }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: rotate(-16deg) translateY(-3px); } 45% { transform: rotate(13deg) translateY(-1px); } 70% { transform: rotate(-8deg); } }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
@keyframes wiggle { 0%, 100% { transform: none; } 25% { transform: rotate(-5deg) scale(1.04); } 60% { transform: rotate(4deg) scale(1.04); } }
@keyframes roll { from { transform: rotate(0); } to { transform: rotate(180deg); } }
@keyframes swing { 0%, 100% { transform: rotate(-9deg); } 50% { transform: rotate(9deg); } }

/* ---------- 插画动画 ---------- */
.art .a-drop { transform-box: view-box; transform-origin: 120px 252px; animation: aDrop .56s var(--ease-out) both; }
.art .a-shadow { transform-box: fill-box; transform-origin: center; animation: aShadow .5s var(--ease-out) both; }
/* 酒液上升：--h 上升距离，--d 开始时间，--t 时长（分层的酒一层接一层） */
.art .a-rise { animation: aRise var(--t, .95s) cubic-bezier(.5, .05, .3, 1) var(--d, .34s) both; }
.art .a-rise-c { animation: aRiseC var(--t, .95s) cubic-bezier(.5, .05, .3, 1) var(--d, .34s) both; }
/* 带气的酒分两段倒：先基酒，停一下，再加满 */
.art .a-rise2 { animation: aRise2 var(--t, 1.4s) ease-in-out var(--d, .34s) both; }
.art .a-rise2-c { animation: aRise2C var(--t, 1.4s) ease-in-out var(--d, .34s) both; }
.art .a-stream { stroke-dasharray: var(--len) var(--len); animation: aStream var(--t, 1.22s) linear var(--d, .2s) both; }
.art .a-fade { animation: aFade .6s ease-out var(--d, 1.4s) both; }
.art .a-drip { transform-box: fill-box; transform-origin: 50% 0; animation: aDrip .8s cubic-bezier(.3, .6, .3, 1) var(--d, 1.4s) both; }
.art .a-crown { transform-box: fill-box; transform-origin: 50% 100%; animation: aCrown .8s var(--ease-out) var(--d, 1.6s) both; }
.art .a-float { animation: aFloat .9s ease-in-out var(--d, 1s) both; }
.art .a-settle { transform-box: fill-box; transform-origin: center; animation: aSettle .6s ease-out var(--d, 1.3s) both; }
.art .a-sway { animation: aSway 4.2s ease-in-out infinite; animation-delay: var(--d, 2.4s); }
.art .a-flame { transform-box: fill-box; transform-origin: 50% 100%; animation: aFlame .46s ease-in-out infinite alternate; }
.art .a-plop { transform-box: fill-box; transform-origin: 50% 70%; animation: aPlop .44s var(--ease-spring) both; animation-delay: var(--d, 1.2s); }
.art .a-ice { animation: aIce .5s var(--ease-spring) both; animation-delay: var(--d, 1s); }
.art .a-bob { animation: aBob 3.4s ease-in-out infinite; animation-delay: var(--d, 2s); }
.art .a-bub { animation: aBub var(--t, 3s) linear infinite both; animation-delay: var(--d, 1.4s); }
.art .a-twinkle { transform-box: fill-box; transform-origin: center; animation: aTwinkle 2.6s ease-in-out infinite both; animation-delay: var(--d, 1.4s); }
.art .a-steam { animation: aSteam 3.2s ease-in-out infinite both; animation-delay: var(--d, 1.5s); }
.art .a-wave { animation: aWave 2.6s linear infinite; }
@keyframes aDrop {
  0% { opacity: 0; transform: translateY(-36px) scale(.94, 1.06); }
  52% { opacity: 1; transform: translateY(0) scale(1.06, .92); }
  76% { transform: translateY(-4px) scale(.98, 1.03); }
  100% { opacity: 1; transform: none; }
}
@keyframes aShadow { from { opacity: 0; transform: scaleX(.4); } to { transform: none; } }
@keyframes aRise { 0% { opacity: 0; transform: translateY(var(--h)); } 1% { opacity: 1; } 100% { opacity: 1; transform: translateY(0); } }
@keyframes aRiseC { from { transform: translateY(calc(var(--h) * -1)); } to { transform: translateY(0); } }
@keyframes aRise2 {
  0% { opacity: 0; transform: translateY(var(--h)); }
  1% { opacity: 1; }
  32% { transform: translateY(calc(var(--h) * .62)); }
  46% { transform: translateY(calc(var(--h) * .62)); }
  100% { opacity: 1; transform: translateY(0); }
}
@keyframes aRise2C {
  0% { transform: translateY(calc(var(--h) * -1)); }
  32% { transform: translateY(calc(var(--h) * -.62)); }

/* 刻度 → 隶属度（0–1）。≥ 0.6 算“有这个特征”，显示成标签；更低的只在检索里算部分匹配 */
const FL_HAS = [0, 0.1, 0.4, 0.85, 1, 1];
const FL_SHOW = 0.6;
function flavorOf(c) {
  if (c.fl) return c.fl;
  const row = FLAVORS[c.id], sweet = row[0], sour = row[1], bitter = row[2], boozy = strengthOf(c), deg = {};
  deg.sweet = [0, 0, 0.15, 0.45, 0.9, 1][sweet];
  deg.dry = [1, 0.9, 0.4, 0.1, 0, 0][sweet];
  deg.sour = [0, 0, 0.2, 0.55, 0.9, 1][sour];
  if (sour === 3 && sweet <= 2) deg.sour = 0.7;          // 酸不算重、但甜更少：整体还是偏酸（玛格丽特、吉姆雷特、大都会）
  deg.sweetsour = Math.min(FL_HAS[sweet], FL_HAS[sour]);
  deg.bitter = [0, 0.1, 0.4, 0.8, 0.95, 1][bitter];
  deg.bittersweet = Math.min(deg.bitter, FL_HAS[sweet]);
  deg.boozy = [0, 0, 0, 0.35, 0.85, 1][boozy];
  deg.light = [0, 1, 0.85, 0.3, 0, 0][boozy];
  const seen = {};
  row[3].split(' ').forEach(function (tok) {
    const faint = tok.slice(-1) === '?', id = faint ? tok.slice(0, -1) : tok, g = FLAVOR_TAGS[id].g, k = seen[g] || 0;
    seen[g] = k + 1;
    deg[id] = faint ? 0.45 : g === 'note' ? Math.max(0.7, 1 - 0.1 * k) : 1;      // 风味按书写顺序略微递减
  });
  const has = FLAVOR_ORDER.filter(function (id) { return (deg[id] || 0) >= FL_SHOW; });
  /* 展示用：有“酸甜”就不再单列“偏酸”“偏甜”，有“苦甜”就不再单列“苦”“偏甜”（刻度上看得出偏哪边） */
  const ss = deg.sweetsour >= FL_SHOW, bs = deg.bittersweet >= FL_SHOW;
  const tags = has.filter(function (id) { return !((ss && (id === 'sour' || id === 'sweet')) || (bs && (id === 'bitter' || id === 'sweet'))); });
  c.fl = { sweet: sweet, sour: sour, bitter: bitter, boozy: boozy, deg: deg, has: has, tags: tags };
  return c.fl;
}

/* 多选风味的模糊匹配：每个标签取隶属度，平均后排序。all = 每个标签都够格（完全符合） */
function flavorMatch(c, ids) {
  const deg = flavorOf(c).deg;
  let sum = 0, full = 0;
  ids.forEach(function (id) { const v = deg[id] || 0; sum += v; if (v >= FL_SHOW) full++; });
  return { c: c, score: ids.length ? sum / ids.length : 0, full: full, all: full === ids.length };
}
function flavorSearch(cocktails, ids) {
  const full = [], part = [];
  if (!ids.length) return { full: full, part: part };
  cocktails.forEach(function (c, i) {
    const m = flavorMatch(c, ids);
    m.pop = i;
    if (m.all) full.push(m); else if (m.score >= 0.34 && (m.full > 0 || ids.length === 1)) part.push(m);
  });
  const by = function (a, b) { return (b.full - a.full) || (b.score - a.score) || (a.pop - b.pop); };
  full.sort(by); part.sort(by);
  return { full: full, part: part };
}

/* 风味相近：四条刻度的距离 + 风味 / 口感 / 风格标签的重合度 */
function flavorSimilar(cocktails, c, n) {
  const a = flavorOf(c), W = { note: 1, texture: 0.7, style: 0.4 };
  const out = [];
  cocktails.forEach(function (x, i) {
    if (x === c) return;
    const b = flavorOf(x);
    let d2 = 0, inter = 0, uni = 0;
    ['sweet', 'sour', 'bitter', 'boozy'].forEach(function (k) { const d = (a[k] - b[k]) / 5; d2 += d * d; });
    FLAVOR_ORDER.forEach(function (id) {
      const w = W[FLAVOR_TAGS[id].g];
      if (!w && id !== 'savory') return;
      const va = a.deg[id] || 0, vb = b.deg[id] || 0, ww = w || 1;
      inter += Math.min(va, vb) * ww; uni += Math.max(va, vb) * ww;
    });
    out.push({ c: x, s: 0.45 * (1 - Math.sqrt(d2) / 2) + 0.55 * (uni ? inter / uni : 0), pop: i });
  });
  out.sort(function (p, q) { return (q.s - p.s) || (p.pop - q.pop); });
  return out.slice(0, n).map(function (r) { return r.c; });
}

function enTypo(s) { return typeof s === 'string' ? s.replace(/'/g, '\u2019') : s; }      // 直撇号 → 排版撇号
/* 所有数据文件都加载完以后调用一次（data_end.js）。v6 新增的酒款自带英文字段，这里只补缺的，再统一处理撇号 */
function attachEnglish() {
  COCKTAILS.forEach(function (c) {
    const e = EN_COCKTAILS[c.id];
    if (e) { c.descEn = e.d; c.stepsEn = e.s; c.garnishEn = e.g; c.tipEn = e.t; }
    if (c.originEn === undefined) c.originEn = EN_ORIGIN[c.origin];
    if (c.srcEn === undefined) c.srcEn = EN_SRC[c.src];
    c.en = enTypo(c.en);
    c.descEn = enTypo(c.descEn); c.stepsEn = (c.stepsEn || []).map(enTypo); c.garnishEn = enTypo(c.garnishEn); c.tipEn = enTypo(c.tipEn);
    c.originEn = enTypo(c.originEn); c.srcEn = enTypo(c.srcEn);
  });
  SPIRITS.forEach(function (s) {
    const e = EN_SPIRITS[s.id] || { facts: [] };
    s.descEn = enTypo(e.desc); s.howEn = enTypo(e.how);
    s.factsEn = s.facts.map(function (f, i) { return [EN_FACT_LABEL[f[0]], enTypo(e.facts[i])]; });
  });
  Object.keys(ING).forEach(function (k) { ING[k][1] = enTypo(ING[k][1]); });
}

 * 成对的字段都写成 [中文, 英文]：origin、src、desc、garnish、tip，steps 里每一步也是一对。

function ADD(r) {
  const c = {
    id: r.id, zh: r.zh, en: r.en, alias: r.alias || [], base: r.base, glass: r.glass, method: r.method,
    origin: r.origin[0], originEn: r.origin[1], src: r.src[0], srcEn: r.src[1],
    desc: r.desc[0], descEn: r.desc[1], ing: r.ing,
    steps: r.steps.map(function (s) { return s[0]; }), stepsEn: r.steps.map(function (s) { return s[1]; }),
    garnish: r.garnish ? r.garnish[0] : '无', garnishEn: r.garnish ? r.garnish[1] : '',

    art: r.look
  };
  if (r.ice) c.ice = r.ice;
  if (r.tech) c.tech = r.tech;                      // 调法标签点过去的技法条目（默认按 method）
  if (r.set) c.set = r.set;                         // 属于哪一批：iba / fortified / modern / japan
  LOOKS[r.id] = r.look;
  FLAVORS[r.id] = r.fl;
  if (r.family) FAMILY_OF[r.id] = r.family;
  if (r.riff) RIFF_OF[r.id] = typeof r.riff[0] === 'string' ? [r.riff] : r.riff;   // [原型, 中文说明, 英文说明]，可以有多条

}

    { id: 'stir', zh: '调和（搅拌）', en: 'Stirring',

    { id: 'build', zh: '兑和', en: 'Building',

    { id: 'muddle', zh: '捣压', en: 'Muddling',
      text: ['用捣棒把水果或香草压出汁水和香气。柑橘和糖可以用力压；薄荷这类香草只要轻轻压几下，捣烂了会发苦。', 'Pressing fruit or herbs with a muddler to release juice and aroma. Citrus and sugar can take a firm press; herbs such as mint need only a few gentle presses, as shredded leaves turn bitter.'] },
    { id: 'blend', zh: '搅和', en: 'Blending',

    { id: 'swizzle', zh: '搓拌', en: 'Swizzling',
      text: ['杯里装满碎冰，把搅棒（或吧勺）插到底，用两手掌心夹住来回搓，同时慢慢往上提，搓到杯壁结霜。Swizzle 类的酒和不少提基酒都这样做。', 'Fill the glass with crushed ice, push a swizzle stick (or a bar spoon) to the bottom, spin it between your palms while slowly lifting it, and keep going until the glass frosts. It is the usual method for swizzles and for many tiki drinks.'] },
    { id: 'throw', zh: '抛接', en: 'Throwing',
      text: ['两只调酒听，一只装着酒和冰，用滤冰器挡住冰，把酒拉成一条长线倒进另一只，再倒回来，来回几次。冷却、稀释的同时带进一点空气，比搅拌蓬松，又不像摇那么猛。', 'Two tins, one holding the drink and ice behind a strainer: pour the liquid in a long stream into the other tin and back again, several times over. It chills and dilutes while working in a little air, lighter than stirring but gentler than shaking.'] },
    { id: 'double-strain', zh: '双重过滤', en: 'Double straining',
      text: ['倒酒时在霍桑滤冰器下面再加一个细网滤网，把冰碴、果肉和香草碎屑拦下来。不加冰出品的摇和酒常这样做，酒面更干净。', 'Pouring through a fine-mesh strainer held under the Hawthorne strainer to catch ice chips, pulp and bits of herb. It is common for shaken drinks served up, and leaves a cleaner surface.'] },
    { id: 'rinse', zh: '洗杯', en: 'Rinsing the glass',
      text: ['往杯里倒少量香气浓的酒，比如约 7.5 ml 苦艾酒，转动杯子让它挂满杯壁，再把多余的倒掉。只留香气，不抢味道。', 'Pour a small measure of something aromatic into the glass, about 7.5 ml of absinthe for instance, turn the glass to coat the inside, and tip out the excess. It leaves the aroma without taking over the drink.'] },
    { id: 'peel', zh: '挤皮油与火焰橙皮', en: 'Expressing & flaming a peel',
      text: ['削一片柑橘皮，皮面朝着酒，在酒面上方一捏，皮油就喷在酒面上；再用它擦一圈杯口，放进杯里或丢掉。隔着火苗捏，皮油会燃一下，带出一点焦香。', 'Cut a strip of citrus peel, hold it skin side down over the drink and pinch: the oils spray across the surface. Run it around the rim, then drop it in or discard it. Pinched through a flame, the oils flare and add a faint caramelized note.'] },
    { id: 'rim', zh: '盐边与糖边', en: 'Salt & sugar rims',
      text: ['用柑橘的切面在杯口外侧抹一圈，再把杯口在盐或糖里滚一下。只沾外侧，别让它掉进酒里。只做半圈的话，喝的人可以自己选。', 'Wet the outside of the rim with a cut piece of citrus, then roll it in salt or sugar, coating the outside only so that none falls into the drink. Rim just half the glass and the drinker gets a choice.'] },
    { id: 'chill', zh: '冰杯', en: 'Chilling the glass',
      text: ['不加冰出品的酒，杯子要先冰好：放进冰箱冷冻室，或者装满冰块和水放几分钟，倒酒前倒掉。杯子不凉，酒很快就温了。', 'For drinks served without ice, chill the glass first: keep it in the freezer, or fill it with ice and water for a few minutes and empty it just before pouring. In a warm glass the drink loses its chill fast.'] },
    { id: 'ice', zh: '冰', en: 'Ice',
      text: ['大方冰化得慢，适合古典、尼格罗尼这类慢慢喝的酒；普通冰块用来摇、搅和做长饮；碎冰降温快，化得也快，用在茱莉普和提基酒里。冰要够冷、够干：表面湿漉漉的冰一摇就化，酒会偏水。', 'A large cube melts slowly and suits sipping drinks such as the Old Fashioned and the Negroni; regular cubes are for shaking, stirring and long drinks; crushed ice chills fast and melts fast, which is what juleps and tiki drinks want. Use ice that is cold and dry: wet, half-melted ice waters a drink down as soon as you shake it.'] },

}

/* ============================================================

const SVGNS = 'http://www.w3.org/2000/svg';
const INK = '#2b2118';
const CX = 120;          // 画布水平中心
const TILT = 0.2;        // 杯口椭圆的透视压缩比

function S(tag, attrs) {

  return el;
}
function add(parent, child) {

  if (Array.isArray(child)) child.forEach(function (c) { add(parent, c); }); else parent.appendChild(child);

}
const n1 = function (v) { return Math.round(v * 10) / 10; };

}
/* 定位 + 可选动画包装：外层 translate，中层动画类，内层 rotate/scale */
function put(node, x, y, rot, scale, cls, vars) {
  let inner = node;

    if (rot) t += 'rotate(' + n1(rot) + ')';
    if (scale && scale !== 1) t += (t ? ' ' : '') + 'scale(' + Math.round(scale * 100) / 100 + ')';
    inner = S('g', { transform: t }, node);

function wrap(node, cls, vars) {

function hexToRgb(h) {

}

}

      const hd = 'M' + hx + ' ' + (yRim + 26) + 'C' + (hx + 42) + ' ' + (yRim + 20) + ' ' + (hx + 42) + ' ' + (yRim + 94) + ' ' + (hx - 2) + ' ' + (yRim + 86);
      add(root, S('path', { d: hd, fill: 'none', stroke: INK, 'stroke-width': n1(9 + SW * 1.7), 'stroke-linecap': 'round' }));
      add(root, S('path', { d: hd, fill: 'none', stroke: opaque[0], 'stroke-width': 9, 'stroke-linecap': 'round' }));
    }
    add(root, S('ellipse', stroke(SW, { cx: CX, cy: yRim, rx: rRim, ry: n1(rRim * TILT), fill: opaque[2] })));
    if (on) root.appendChild(stream(tPour - 0.1, 1, mix(mainC, INK, 0.1), yS));
    add(root, fade(S('ellipse', { cx: CX, cy: n1(yS), rx: n1(rS), ry: n1(ryS), fill: surfC }), tPour + 0.15));
  } else {
    /* ---- 透明玻璃杯 ---- */
    if (V.stem) {
      const fy = V.stem + 5;
      add(root, S('ellipse', stroke(SW, Object.assign({ cx: CX, cy: fy, rx: V.foot, ry: n1(V.foot * TILT) }, GLASS))));
      add(root, S('rect', Object.assign({ x: CX - 4.5, y: n1(yBot - 2), width: 9, height: n1(fy - yBot) }, GLASS)));
      add(root, S('path', stroke(SW, { d: 'M' + (CX - 4.5) + ' ' + n1(yBot - 1) + 'V' + n1(fy - 1) + 'M' + (CX + 4.5) + ' ' + n1(yBot - 1) + 'V' + n1(fy - 1), fill: 'none' })));
    }
    if (V.handle) {
      const r0 = radiusAt(P, yRim + 22), r1 = radiusAt(P, yRim + 76);
      const hd = 'M' + n1(CX + r0 - 2) + ' ' + (yRim + 22) + 'C' + n1(CX + r0 + 36) + ' ' + (yRim + 18) + ' ' + n1(CX + r1 + 38) + ' ' + (yRim + 80) + ' ' + n1(CX + r1 - 2) + ' ' + (yRim + 76);
      add(root, S('path', { d: hd, fill: 'none', stroke: INK, 'stroke-width': n1(7 + SW * 1.7), 'stroke-linecap': 'round' }));
      add(root, S('path', { d: hd, fill: 'none', stroke: '#f3f7f8', 'stroke-width': 7, 'stroke-linecap': 'round' }));
    }
    add(root, S('path', Object.assign({ d: bowlD(P, 0, yRim, yBot, 'back') }, GLASS)));
    add(root, S('path', stroke(SW * 0.7, { d: rimArc(1), fill: 'none' })));

    /* 酒流：每一层各倒一次；带气的酒先倒基酒，再用更浅的一股加满 */
    if (on) layers.forEach(function (Ly) {
      const col = mix(Ly.grad ? Ly.grad[Math.floor(Ly.grad.length / 2)][1] : Ly.c, INK, 0.1);
      if (twoPhase && !Ly.foam) {
        root.appendChild(stream(Ly.t0 - 0.12, Ly.dur * 0.36 + 0.16, col, yBotIn - 3));
        const st = stream(Ly.t0 + Ly.dur * 0.44, Ly.dur * 0.56 + 0.1, mix(Ly.c, INK, 0.22), yBotIn - 3);
        st.setAttribute('stroke-width', 9.6);
        root.appendChild(st);
        root.appendChild(stream(Ly.t0 + Ly.dur * 0.44, Ly.dur * 0.56 + 0.1, mix(Ly.c, '#ffffff', 0.62), yBotIn - 3));
      } else root.appendChild(stream(Ly.t0 - 0.12, Ly.dur + 0.2, col, yBotIn - 3));
    });
    /* 最后漂上去 / 沉下去的那一股（奶油、黑朗姆、红石榴糖浆……）只倒到液面 */
    if (on && over) root.appendChild(stream(tFull - 0.08, 0.78, mix(over.grad[over.kind === 'sink' ? over.grad.length - 1 : 0][1], INK, 0.08), yS + 2));

    /* 酒液：每一层有自己的上升动画，上一层到位后下一层才开始 */
    if (body === 'clear') {
      add(defs, S('linearGradient', { id: uid + 'w' },
        S('stop', { offset: 0, 'stop-color': '#ffffff', 'stop-opacity': 0 }), S('stop', { offset: 0.5, 'stop-color': '#ffffff', 'stop-opacity': 0.3 }), S('stop', { offset: 1, 'stop-color': '#ffffff', 'stop-opacity': 0 })));
    }
    const stops = function (g) { return g.map(function (s) { return S('stop', { offset: s[0], 'stop-color': s[1] }); }); };
    let yb = yBotIn;
    layers.forEach(function (Ly, i) {
      const last = i === layers.length - 1, yt = last ? yS : yb - Ly.f * H, hL = yb - yt, rT = rIn(yt), ryT = rT * TILT, deep = i ? 0.6 : 40;
      let paint = Ly.c;
      if (Ly.grad) {
        add(defs, S('linearGradient', { id: uid + 'g' + i, gradientUnits: 'userSpaceOnUse', x1: 0, y1: n1(yt), x2: 0, y2: n1(yb) }, stops(Ly.grad)));
        paint = 'url(#' + uid + 'g' + i + ')';
      }
      const still = S('g', null, S('rect', { x: CX - 110, y: n1(yt), width: 220, height: n1(hL + deep), fill: paint }));
      if (i) add(still, S('ellipse', { cx: CX, cy: n1(yb), rx: n1(rIn(yb) + 1.5), ry: n1((rIn(yb) + 1.5) * TILT), fill: Ly.grad ? Ly.grad[Ly.grad.length - 1][1] : Ly.c }));
      if (over && !i) {
        /* 渐变叠层：静态时直接盖住主体色；动画里等酒倒满之后才慢慢显出来 */
        add(defs, S('linearGradient', { id: uid + 'o', gradientUnits: 'userSpaceOnUse', x1: 0, y1: n1(yt), x2: 0, y2: n1(yb) }, stops(over.grad)));
        add(still, fade(S('rect', { x: CX - 110, y: n1(yt), width: 220, height: n1(hL + deep), fill: 'url(#' + uid + 'o)' }), tFull + 0.04));
        if (over.kind === 'bleed' || has('swirl')) {
          /* 从上往下渗的几缕颜色（淋在碎冰上的利口酒、漂在咖啡酒上的奶油） */
          const rr = prng(hashStr(c.id) + 11), bleed = over.kind === 'bleed', y0 = bleed ? yt : yt + hL * 0.3;
          const tg = S('g', { fill: 'none', stroke: over.grad[0][1], 'stroke-linecap': 'round', opacity: bleed ? 0.62 : 0.85 });
          for (let k = 0; k < 4; k++) {
            const x = CX + (-0.62 + k * 0.41 + (rr() - 0.5) * 0.14) * rIn(y0 + 10), len = (yb - y0) * (0.42 + rr() * 0.45), s = rr() < 0.5 ? -1 : 1;
            const p = S('path', { d: 'M' + n1(x) + ' ' + n1(y0 - 2) + 'q' + 5 * s + ' ' + n1(len * 0.3) + ' 0 ' + n1(len * 0.55) + 't' + -3 * s + ' ' + n1(len * 0.45), 'stroke-width': n1(4 + rr() * 4) });
            add(tg, on ? wrap(p, 'a-drip', { '--d': n2(tFull + 0.1 + k * 0.09) + 's' }) : p);
          }
          add(still, tg);
        }
      }
      add(still, S('rect', { x: n1(CX + rS * 0.5), y: n1(yt), width: 120, height: n1(hL + deep), fill: '#000000', opacity: 0.07 }));
      if (body === 'clear' && !Ly.foam) add(still, S('rect', { x: n1(CX - rS * 0.82), y: n1(yt), width: n1(rS * 0.44), height: n1(hL + deep), fill: 'url(#' + uid + 'w)' }));

      /* 液面：只有最上面一层描边；下面几层的液面会被上一层盖住 */
      const surf = S('g');
      if (!last) add(surf, S('ellipse', { cx: CX, cy: n1(yt), rx: n1(rT), ry: n1(ryT), fill: mix(Ly.grad ? Ly.grad[0][1] : Ly.c, '#ffffff', 0.25) }));
      else {
        const e = { cx: CX, cy: n1(yt), rx: n1(rT), ry: n1(ryT) };
        if (over && !Ly.foam) {
          add(surf, S('ellipse', Object.assign({ fill: mix(over.base, '#ffffff', 0.3) }, e)));
          add(surf, fade(S('ellipse', Object.assign({ fill: surfC }, e)), tFull + 0.04));
          add(surf, S('ellipse', stroke(SW * 0.5, Object.assign({ fill: 'none', 'stroke-opacity': 0.5 }, e))));
        } else add(surf, S('ellipse', stroke(SW * 0.5, Object.assign({ fill: surfC, 'stroke-opacity': 0.5 }, e))));
        if (Ly.foam && A.foamTop === 'bubbly') {
          /* 粗泡：沿着液面边缘的一圈小气泡 */
          const rr = prng(hashStr(c.id) + 13), bs = stroke(SW * 0.3, { fill: '#ffffff', 'stroke-opacity': 0.3 });
          for (let k = 0; k < 9; k++) {
            const a = (k / 9) * 6.283 + rr() * 0.4, d = 0.5 + rr() * 0.36;
            add(surf, S('circle', Object.assign({ cx: n1(CX + Math.cos(a) * rT * d), cy: n1(yt + Math.sin(a) * ryT * d), r: n1(1.5 + rr() * 1.7) }, bs)));
          }
        } else if (!Ly.foam && body === 'cloudy' && rT > 14) {
          /* 摇过的酒：液面边缘有一圈细沫 */
          add(surf, S('ellipse', { cx: CX, cy: n1(yt), rx: n1(rT - 2.4), ry: n1(Math.max(0.5, ryT - 1)), fill: 'none', stroke: mix(topC, '#ffffff', 0.66), 'stroke-width': 2.2 }));
        } else if (!Ly.foam && body === 'clear' && rT > 14) {
          /* 通透的酒：液面上的一道反光 */
          add(surf, S('path', { d: 'M' + n1(CX - rT * 0.66) + ' ' + n1(yt - ryT * 0.18) + 'Q' + n1(CX - rT * 0.36) + ' ' + n1(yt - ryT * 0.74) + ' ' + n1(CX + rT * 0.02) + ' ' + n1(yt - ryT * 0.7), fill: 'none', stroke: '#ffffff', 'stroke-width': 2, 'stroke-linecap': 'round', opacity: 0.75 }));

      add(defs, S('clipPath', { id: uid + 'l' + i }, S('rect', { x: -60, y: n1(yt), width: 360, height: 420 })));
      const cls = on ? (twoPhase && !Ly.foam ? 'a-rise2' : 'a-rise') : null;
      const rise = S('g', { class: cls }, S('g', { 'clip-path': 'url(#' + uid + 'l' + i + ')' }, S('g', { class: cls ? cls + '-c' : null }, still)),
        on && last ? wrap(surf, 'a-settle', { '--d': n2(Ly.t0 + Ly.dur - 0.08) + 's' }) : surf);
      if (on) {

        rise.style.setProperty('--d', n2(Ly.t0) + 's');
        rise.style.setProperty('--t', n2(Ly.dur) + 's');
      }
      inGlass.appendChild(rise);
      yb = yt;
    });
  }

  /* ---- 杯中物（冰块后面）：捣压的青柠和薄荷、杯底的方糖、沉底的樱桃…… ---- */
  G.forEach(function (t) {
    switch (t.n) {
      case 'inlime':
        [[-0.42, 0.42, 28], [0.4, 0.6, -38], [-0.05, 0.82, 168]].forEach(function (p, k) { add(inGlass, fall(gWedge('lime'), CX + rS * p[0], yS + H * p[1], p[2], 0.8, k)); });
        break;
      case 'inmint':
        [[-0.5, 0.3, -40], [0.45, 0.48, 35], [-0.3, 0.66, 150], [0.35, 0.85, -120]].forEach(function (p, k) { add(inGlass, fall(gLeaf(), CX + rS * p[0], yS + H * p[1], p[2], 0.62, k + 1)); });
        break;
      case 'sugarcube': add(inGlass, fall(gSugarCube(), CX, yBotIn - 12, 14, Math.min(1, rIn(yBotIn - 12) / 8), 0)); break;
      case 'slice': add(inGlass, pop(gHalf(t.k), CX - rS * 0.34, yS + 12, -26, Math.min(1.15, rS / 30))); break;
      case 'cherry':

          const ball = t.k === 'dark' || t.k === 'green', ch = t.k === 'dark' ? gCherryBall(1) : t.k === 'green' ? gCherryBall(2) : gCherry(1);
          add(inGlass, A.ice ? pop(ch, CX + rS * 0.6, yBotIn - 14, 0, 0.95) : pop(ch, CX - 2, yS + H * 0.56, 0, ball ? 1.05 : 0.95));
        }

        break;

        const slush = t.n === 'slush', rr = prng(hashStr(c.id) + 5), sp = S('g', { fill: slush ? '#ffffff' : '#4a1c10', opacity: slush ? 0.75 : 0.7 });
        for (let k = 0; k < (slush ? 18 : 13); k++) {

        }

  /* ---- 冰 ---- */
  const shardRnd = prng(hashStr(c.id) + 2);
  ice.concat(domeIce).forEach(function (p, i) {

    let node = p[4] === 'sphere' ? gSphere(p[2]) : p[4] === 'spear' ? gSpear(p[2], H * 0.93 + 7) : p[4] === 'shard' ? gShard(p[2], shardRnd, !inIce) : gIce(p[2]);

      if (rest) node = wrap(node, 'a-float', { '--rest': n1(rest) + 'px', '--d': n2(tPour + 0.2) + 's' });

  });

  /* ---- 杯中物（贴着杯壁、在冰块前面） ---- */
  G.forEach(function (t) {

    else if (t.n === 'wedge' && t.at === 'in') add(inGlass, pop(gWedge(t.k), CX + rS * 0.2, yS + 7, -14, Math.min(1.1, rS / 28)));
    else if (t.n === 'strawberry' && t.at === 'in') add(inGlass, pop(gStrawberry(), CX - rS * 0.34, yS + H * 0.66, -18, 1.1));
    else if (t.n === 'juniper') [[0.46, 9], [-0.52, 24], [0.14, 33]].forEach(function (p) { add(inGlass, pop(gJuniper(), CX + rS * p[0], yS + p[1])); });
    else if (t.n === 'ribbon') {
      /* 贴着杯壁的一长条黄瓜片 */
      const x0 = CX + rS * 0.44, y0 = yS + 5, seg = (yBotIn - 9 - y0) / 4, a = { fill: 'none', 'stroke-linecap': 'round' };
      let d = 'M' + n1(x0) + ' ' + n1(y0);

      a.d = d;
      add(inGlass, popAbs(S('g', null,
        S('path', Object.assign({ stroke: INK, 'stroke-opacity': 0.6, 'stroke-width': n1(13 + SW * 0.7) }, a)),
        S('path', Object.assign({ stroke: '#4a9a3f', 'stroke-width': 13 }, a)),
        S('path', Object.assign({ stroke: '#dcefba', 'stroke-width': 8.6 }, a)),
        S('path', Object.assign({ stroke: '#b3d886', 'stroke-width': 1.8, 'stroke-dasharray': '0.1 7' }, a)))));
    }
  });

  /* ---- 气泡 ---- */
  if (A.fizz && !opaque) {
    const rr = prng(hashStr(c.id) + 7);
    if (/^(flute|coupe|martini|nicknora)$/.test(c.glass)) {
      /* 香槟：从杯底连成串往上冒 */
      const y0 = yBotIn - 5, n = Math.max(3, Math.round((y0 - yS) / 13)), T = 1.5 + n * 0.22;
      (c.glass === 'flute' ? [-0.34, 0.3] : [-0.5, 0.04, 0.52]).forEach(function (fx, s) {
        const x = CX + fx * Math.min(rS, rIn(y0 - 12) * 1.7), chain = S('g');
        for (let k = 0; k < n; k++) {
          const b = S('circle', { cx: n1(x + (k % 2 ? 1.6 : -1.6)), cy: n1(on ? y0 : y0 - (k + 0.5) / n * (y0 - yS)), r: n1(1.4 + (k % 3) * 0.5), fill: '#ffffff', 'fill-opacity': 0.8 });
          if (on) {

      const nb = on ? 9 : 5;
      for (let i = 0; i < nb; i++) {
        const y0 = yS + 14 + rr() * Math.max(4, H - 24), x = CX + (rr() - 0.5) * 1.5 * Math.min(rIn(y0), rS), r = 1.8 + rr() * 2;

          b.setAttribute('class', 'a-bub');
          b.style.setProperty('--rise', n1(yS - y0 + 3) + 'px');
          b.style.setProperty('--t', n1(1.5 + (y0 - yS) / 45 + rr()) + 's');

        }

      }

  }

  /* ---- 杯口和液面上的装饰 ---- */
  const rimX = CX + rRim * 0.8, pickA = [CX - rRim * 0.5, yRim + 4, CX + rRim + 14, yRim - 10];      // 横架在杯口的酒签
  G.forEach(function (t) {
    const k = t.k, at = t.at;
    switch (t.n) {
      case 'wheel':
        if (at === 'float') add(topG, pop(gWheelFlat(k), CX + rS * 0.12, yS - 1, 0, Math.min(1.1, rS / 26)));
        else if (!at) add(topG, pop(sway(gWheel(k)), rimX, yRim - 2, -14, rimScale));

      case 'clovewheel': {
        const w = gWheelFlat('lemon');
        [[-7, -1.2], [0, 2.4], [7, -1], [0, -3.6]].forEach(function (p) { add(w, S('circle', { cx: p[0], cy: p[1], r: 1.7, fill: '#4a2a17' })); });
        add(topG, pop(w, CX + rS * 0.16, yS - 1, 0, Math.min(1.15, rS / 26)));
        break;
      }
      case 'half': add(topG, pop(sway(gHalf(k)), rimX, yRim - 4, 30, rimScale)); break;
      case 'wedge': if (!at) add(topG, pop(sway(gWedge(k)), rimX, yRim - 3, 36, rimScale)); break;
      case 'twist': add(topG, pop(sway(gTwist(k)), CX + rRim * 0.88, yRim - 5, -8, rimScale)); break;
      case 'swath':
        if (at === 'float') add(topG, pop(gSwathFlat(k), CX - rS * 0.04, yS, -4, Math.min(1.25, rS / 30)));
        else if (at === 'ice') add(upG, pop(gSwath(k), CX + rS * 0.5, yS + 14, 15, 1.1));
        else if (at === 'in') add(inGlass, pop(gSwath(k), CX - rS * 0.1, yS + H * 0.8, 24, Math.min(1, rS / 40)));
        else add(topG, pop(has('flame') ? gSwath(k) : sway(gSwath(k)), CX + rRim * 0.86, yRim + 10, 16, rimScale * 1.05));
        break;
      case 'coin': add(topG, pop(gCoin(k), CX + rS * 0.2, yS + 0.5, -6, Math.min(1.15, rS / 27))); break;
      case 'spiral':

        if (c.glass === 'flute' || at === 'in') add(topG, pop(gSpiral(k, H * (at === 'in' ? 0.78 : 0.6)), CX + rRim * 0.5, yRim + 1, 0, at === 'in' ? Math.min(1, rRim / 34) : 0.8));

      case 'cherry': if (!at) add(topG, pop(sway(gCherry(-1)), CX - rRim * 0.84, yRim - 5, 0, 1)); break;
      case 'cherrypick':
        add(topG, popAbs(gSkewer(pickA[0], pickA[1], pickA[2], pickA[3], at === '3' ? [[0.28, gCherryBall(1)], [0.5, gCherryBall(1)], [0.72, gCherryBall(1)]]
          : at === '2' ? [[0.36, gCherryBall(1)], [0.6, gCherryBall(1)]] : [[0.5, gCherryBall(1)]])));
        break;
      case 'berriespick': {
        const mk = k === 'black' ? gBlackberry : k === 'grape' ? gGrape : gRaspberry;
        add(topG, popAbs(gSkewer(pickA[0], pickA[1], pickA[2], pickA[3], [[0.28, mk(), 0, 0.82], [0.5, mk(), 0, 0.82], [0.72, mk(), 0, 0.82]])));
        break;
      }

/* ============================================================
 * 模糊搜索引擎（纯函数，不依赖 DOM）
 * 支持：中文 / 英文 / 别名 / 全拼 / 拼音首字母 / 缩写 / 拼写容错 / 同音字 / 多关键词 / 风味词

/* 展示文本 → 归一化串（只留字母、数字、汉字）。

/* 汉字串 → 全拼 / 首字母。map 指回原汉字位置；全拼的 bound 是每个音节的开头，word 只有整串开头。 */

/* 缩写 / 跳字匹配：字符按顺序出现，首字符在词首；每次“跳过”之后必须落在词首或音节首

      let best = NEG, bj = -1;
      for (let k = i - 1; k < j; k++) {

        const gap = j - k - 1;
        if (gap > 0 && !(F.bound[j] || cjk)) continue;       // 跳过之后必须落在词首
        if (gap > 0 && bc[j - 1] - bc[k] > 0) continue;       // 不能整个跳过中间的词或音节
        const v = prev[k] + (gap === 0 ? 0.8 : -Math.min(0.6, 0.08 * gap));

  const flush = function () {
    if (!buf) return;
    frag.appendChild(on ? H('mark', { text: buf }) : document.createTextNode(buf));

$('btn-home').addEventListener('click', function () { setQuery(''); goHome(); });
$('btn-guide').addEventListener('click', function () { setQuery(''); closeList(); openGuide(null); });
document.addEventListener('keydown', function (e) {
  if (e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  e.preventDefault();
  input.focus();
});

/* 没在打字、也没聚焦时的占位文字：宽屏用带例子的那句，窄屏放不下，用短的 */
function restPlaceholder() { return window.innerWidth < 480 ? T('searchPh') : T('searchPh0'); }
window.addEventListener('resize', function () { if (!typer && document.activeElement !== input) input.placeholder = restPlaceholder(); });
/* 占位文字打字机：演示可以怎么搜 */
let typer = null;
function startTyper() {
  if (REDUCED || typer || input.value) return;
  let si = 0, ci = 0, dir = 1, hold = 6;
  typer = setInterval(function () {
    if (hold > 0) { hold--; return; }
    const samples = T('samples');
    let w = samples[si % samples.length];
    ci += dir;
    if (ci >= w.length) { ci = w.length; dir = -1; hold = 14; }
    else if (ci <= 0) { dir = 1; si = (si + 1) % samples.length; w = samples[si]; ci = 1; hold = 2; }     // 删完直接换成下一个词的第一个字，不露出空引号
    input.placeholder = T('typer', w.slice(0, ci));
  }, 110);
}
function stopTyper() {
  if (typer) { clearInterval(typer); typer = null; }
  input.placeholder = T('searchPh');
}

/* ---------- 首页的快捷入口：基酒 + 常用风味 ---------- */
function renderChips() {
  const chips = $('chips'), fchips = $('flavor-chips');
  chips.textContent = '';
  SPIRITS.forEach(function (s) {
    chips.appendChild(H('button', { class: 'chip', type: 'button', 'aria-label': T('chipAria', nameOf(s)), onclick: function () { openSpirit(s.id); } }, dot(s.color), nameOf(s)));
  });
  fchips.textContent = '';
  /* 第一颗是“按风味找酒”的入口，后面是几个常用风味（窄屏上这一排横向滑动，入口要排在看得见的位置） */
  fchips.appendChild(H('button', { class: 'chip chip-fl chip-find', type: 'button', onclick: function () { openFlavor([]); } }, icon(ICON.tag, 16), T('finder'), icon(ICON.arrow, 14)));
  FLAVOR_FEATURED.forEach(function (id) {
    fchips.appendChild(H('button', { class: 'chip chip-fl', type: 'button', 'aria-label': T('flavorChipAria', tagName(id)), onclick: function () { openFlavor([id]); } }, tagName(id)));
  });
}

/* ---------- 语言 ---------- */
function applyLang() {
  document.documentElement.lang = LANG_CODE[LANG];
  const meta = document.querySelector('meta[name="description"]');
  if (meta) meta.setAttribute('content', T('metaDesc', COCKTAILS.length));
  document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = T(el.getAttribute('data-t')); });
  document.querySelectorAll('[data-t-aria]').forEach(function (el) { el.setAttribute('aria-label', T(el.getAttribute('data-t-aria'))); });
  ['zh', 'en'].forEach(function (l) { $('lang-' + l).setAttribute('aria-pressed', l === LANG ? 'true' : 'false'); });
  renderChips();
  if (typer) { clearInterval(typer); typer = null; }
  input.placeholder = document.activeElement === input ? T('searchPh') : restPlaceholder();
  if (document.activeElement !== input) startTyper();
}
function setLang(l) {
  if (l === LANG) return;
  const cur = state.type === 'cocktail' ? COCKTAIL_BY_ID[state.id] : state.type === 'spirit' ? SPIRIT_BY_ID[state.id] : null;
  const shown = cur && input.value === nameOf(cur);          // 搜索框里显示的是当前这杯酒的名字：跟着换语言
  LANG = l;
  saveLang(l);
  applyLang();
  if (shown) setQuery(nameOf(cur));
  /* 原地重画当前页面 */
  const y = window.scrollY;
  homeNode = null;
  quiet = true;
  if (state.type === 'cocktail') openCocktail(state.id, true);
  else if (state.type === 'spirit') openSpirit(state.id, true);
  else if (state.type === 'flavor') openFlavor(flavorPicked, true);
  else if (state.type === 'guide') openGuide(null, true);
  else goHome(true);
  quiet = false;
  window.scrollTo(0, y);
  if (listOpen) runSearch();
}
$('lang-zh').addEventListener('click', function () { setLang('zh'); });
$('lang-en').addEventListener('click', function () { setLang('en'); });

/* ---------- 启动 ---------- */
(function init() {
  LANG = initialLang();
  applyLang();
  window.addEventListener('popstate', function () { fromHash(true); });
  fromHash();
})();

})();
</script>
</body>
</html>
